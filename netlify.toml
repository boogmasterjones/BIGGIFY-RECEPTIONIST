# Netlify auto-deploys the Biggify marketing site (static HTML).
# It publishes ONLY the site folder; the voice server lives in /server and
# deploys separately (Render/Railway/Fly — it needs a persistent WebSocket).

[build]
  publish = "BIGGIFY WEBSITE"
  command = ""
  # Skip the build (and its credits) when a push only changes the voice server.
  # The build is skipped when this exits 0: nothing changed in the site, the dashboard or this file.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- 'BIGGIFY WEBSITE' dashboard netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
