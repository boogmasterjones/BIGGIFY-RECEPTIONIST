# Render Blueprint — deploys the Biggify voice receptionist (server/).
# In Render: New → Blueprint → connect this repo. Render reads this file,
# then prompts you for the one secret it needs (ANTHROPIC_API_KEY).
#
# Plan is "starter" ($7/mo, always-on) — real phone calls need this, since the
# free plan sleeps after inactivity and cold-starts in ~30s, which would drop
# an incoming call that arrives while the server is asleep.

services:
  - type: web
    name: biggify-receptionist
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # Render will prompt you to paste this (kept secret)
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5  # fastest on a live call; sonnet-5 is smarter but audibly slower
      # Fallback business identity, used ONLY when the dialed number isn't mapped
      # to a row in Supabase's phone_numbers table. It has to describe Biggify —
      # if it describes someone else, an unmapped number answers as the wrong
      # company and qualifies callers against the wrong service list.
      - key: BUSINESS_NAME
        value: Biggify
      - key: BUSINESS_TRADE
        value: AI receptionist, marketing, and automation
      - key: BUSINESS_HOURS
        value: 7 days a week, 8am to 8pm ET
      - key: BUSINESS_SERVICE_AREA
        value: home-service businesses across the U.S.
      - key: BUSINESS_SERVICES
        value: AI receptionists and 24/7 call answering, appointment booking, lead capture, website design, Google Business Profile management, local SEO, social media management, social media marketing, Facebook and Instagram marketing, Google Ads, Meta Ads, and lead generation for home-service businesses
      - key: RECEPTIONIST_VOICE
        value: en-US-Journey-O
      # Twilio + Cal.com left unset on purpose → SMS/booking run in mock mode.
      # Add them in the Render dashboard once you have a number / Cal.com / 10DLC.
